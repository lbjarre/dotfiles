[[--scope]]
--when.repositories = ["~/src/github.com/modal-labs"]
[--scope.user]
email = "lukas@modal.com"
[--scope.signing]
key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHAPZT7/jOrDlplzrZ+mvA2ToS50hcPVm897WehsEa9d lukas@modal.com"

[signing]
behavior = "own"
backend = "ssh"
key = "~/.ssh/id_ed25519.pub"

[signing.backends.ssh]
program = "ssh-keygen"

[git]
sign-on-push = true
# Private commits: refuse to push commits that starts with 'PRIVATE:'.
private-commits = "subject(glob:'PRIVATE:*')"

[ui]
default-command = ["log", "--no-pager"]
diff-editor = ["nvim", "-c", "DiffEditor $left $right $output"]

[templates]
draft_commit_description = '''
concat(
  builtin_draft_commit_description,
  "\nJJ: The rest of this file is ignored after the next line\nJJ: ignore-rest\n",
  "\nJJ: diff.stat():\n",
  diff.stat(),
  "\nJJ: diff.git():\n",
  diff.git(),
)
'''

[aliases]
# tug: move the closest bookmark to the closest non-empty change. Basically a
# way of updating bookmarks more like Git branches.
tug = ["bookmark", "move", "--from", "closest_bookmark(@)", "--to", "closest_nonempty(@)"]

# restack: rebase all work-in-progress local changes onto trunk.
restack = ["rebase", "--source", "roots(mutable())", "--destination", "trunk()"]

# sync: jj git fetch && jj rebase-all
# Maybe want to jj git push also? Keeping it off for now.
sync = ["util", "exec", "bash", "--", "-c", "jj git fetch && jj restack"]

[revset-aliases]
"closest_bookmark(to)" = "heads(::to & bookmarks())"
"closest_nonempty(to)" = "heads(::to ~ empty())"

